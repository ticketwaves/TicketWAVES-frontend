<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d14"><title>Your Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container content-pad"><a class="text-btn" href="index.html#tickets">← My Tickets</a><div id="ticketBox" style="margin-top:14px"><div class="skeleton-card"></div></div></div><div id="toast" class="toast"></div><script src="config.js"></script><script>
const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',token=localStorage.getItem('ticketwaves_token')||'',id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(m){const x=$('toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2800)}
async function api(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to load ticket');return d}
async function load(){if(!token){location.href='index.html#login';return}if(!id){$('ticketBox').innerHTML='<div class="empty">Ticket ID is missing.</div>';return}try{const t=await api('/tickets/'+encodeURIComponent(id));const e=t.event||{};$('ticketBox').innerHTML=`<article class="ticket-card ticketmaster-inspired"><div class="ticket-image">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.title)}">`:`<div class="art-word">${esc(e.artist||e.title||'TICKETWAVES')}</div>`}<div class="ticket-chip">MOBILE ENTRY</div></div><div class="ticket-main"><small class="tiny-label">YOUR TICKET IS READY</small><h2>${esc(e.title||'Live event')}</h2><div class="ticket-muted">${esc(e.date||'')} · ${esc(e.time||'')}</div><p>${esc(e.venue||'')}${e.city?' · '+esc(e.city):''}${e.country?' · '+esc(e.country):''}</p><div class="detail-list"><div><small>SECTION</small><b>${esc(t.section||'General')}</b></div><div><small>ROW</small><b>${esc(t.row||'—')}</b></div><div><small>SEAT</small><b>${esc(t.seat||'—')}</b></div><div><small>TICKET CODE</small><b>${esc(t.ticketCode||'—')}</b></div></div><div class="ticket-verification-panel" style="margin-top:14px"><div class="ticket-qr-wrap"><img id="qr" class="qr-refresh" alt="Secure rotating TicketWAVES QR"><div id="qrStatus" class="qr-status">Preparing secure entry code…</div></div></div><p class="ticket-note">Your QR verification code refreshes automatically. Keep this ticket open when you reach the venue.</p><div class="ticket-actions"><button class="secondary action-btn" onclick="transferFromTicket('${esc(t.id)}')">Transfer</button><button class="secondary action-btn" onclick="shareTicket()">Share</button><button class="secondary action-btn" onclick="downloadPdf('${esc(t.id)}')">PDF</button><button class="primary action-btn" onclick="location.href='index.html#tickets'">Done</button></div></div></article>`;refreshQr(t.id)}catch(e){$('ticketBox').innerHTML='<div class="empty">'+esc(e.message)+'<br><button class="secondary" onclick="load()">Try again</button></div>'}}
async function refreshQr(ticketId){try{const r=await fetch(API+'/tickets/'+encodeURIComponent(ticketId)+'/verify-code',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to refresh code');$('qr').classList.remove('qr-refreshing');void $('qr').offsetWidth;$('qr').classList.add('qr-refreshing');$('qr').src=d.qrDataUrl||'';$('qrStatus').textContent='Live verification code · refreshes every 15 seconds · valid until '+new Date(d.expiresAt).toLocaleTimeString();clearTimeout(window.qrTimer);window.qrTimer=setTimeout(()=>refreshQr(ticketId),15000)}catch(e){if($('qrStatus'))$('qrStatus').textContent='Unable to refresh code. Tap the page refresh button and try again.';clearTimeout(window.qrTimer);window.qrTimer=setTimeout(()=>refreshQr(ticketId),5000)}}
function shareTicket(){if(navigator.share)navigator.share({title:'TicketWAVES ticket',url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href).then(()=>toast('Ticket link copied.'))}
function downloadPdf(id){location.href=API+'/tickets/'+encodeURIComponent(id)+'/pdf'}
function transferFromTicket(id){localStorage.setItem('ticketwaves_open_transfer',id);location.href='index.html#tickets'}
load();</script></body></html>
