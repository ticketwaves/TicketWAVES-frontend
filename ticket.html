<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a10">
<title>Your Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head>
<body class="ticket-page"><header class="ticket-top"><a href="index.html#tickets" class="ticket-back">‹</a><span>TICKETWAVES</span><button class="ticket-help" onclick="location.href='index.html#account'">Help</button></header>
<main><div id="ticketBox" class="ticket-screen"><div class="skeleton-card"></div></div></main>
<div id="toast" class="toast"></div>
<script src="config.js"></script><script>
const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',token=localStorage.getItem('ticketwaves_token')||'',id=new URLSearchParams(location.search).get('id');
const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(m){const x=$('toast');x.textContent=m;x.classList.add('show');clearTimeout(window.__toast);setTimeout(()=>x.classList.remove('show'),3000)}
async function api(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to load ticket');return d}
async function load(){
 if(!token){location.href='index.html#login';return}
 if(!id){$('ticketBox').innerHTML='<div class="empty">Ticket ID is missing.</div>';return}
 try{
  const t=await api('/tickets/'+encodeURIComponent(id));const e=t.event||{};const loc=[e.venue,e.city,e.country].filter(Boolean).join(' · ');const holder=t.owner||{};const holderName=holder.name||`${holder.firstName||''} ${holder.surname||''}`.trim()||'Ticket holder';const order=t.orders?.[0]||{};
  $('ticketBox').innerHTML=`
   <section class="tm-ticket">
    <div class="tm-hero">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.title||'Event')}">`:''}<div class="tm-hero-top"><button class="circle-back" onclick="location.href='index.html#tickets'">‹</button><button class="help-link" onclick="location.href='index.html#account'">Help</button></div>
    <div class="tm-hero-info"><small>${esc(e.date||'')} · ${esc(e.time||'')}</small><h1>${esc(e.title||'Live event')}</h1><p>${esc(loc)}</p></div></div>
    <div class="tm-summary"><div class="tm-tabs"><button class="active">Tickets</button><button>Extras</button></div>
      <div class="tm-order"><div><small>ORDER</small><b>#${esc(order.reference||t.ticketCode||t.id.slice(0,12).toUpperCase())}</b><span>×${Number(t.quantity||1)} Ticket</span><span>Holder: ${esc(holderName)}</span></div><button class="more-btn" onclick="toast('Ticket options are ready.')">•••</button></div>
      <div class="tm-ticket-block"><div class="tm-ticket-label">TICKET</div><div class="tm-seat-grid"><div><small>SECTION</small><b>${esc(t.section||'General')}</b></div><div><small>ROW</small><b>${esc(t.row||'—')}</b></div><div><small>SEAT</small><b>${esc(t.seat||'—')}</b></div></div></div>
      <div class="tm-entry"><div class="entry-heading"><div><small>MOBILE ENTRY</small><b>Secure ticket</b></div><span id="qrStatus">Preparing…</span></div>
        <div class="qr-stage"><div class="scan-line"></div><img id="qr" alt="Rotating secure ticket QR"></div>
        <p class="qr-help">This secure code refreshes automatically. Screenshots are not a valid way to enter.</p>
        <div class="verified-pill">✓ TicketWAVES security active</div>
      </div>
      <div class="tm-more"><h3>MORE OPTIONS</h3><div class="tm-actions"><button onclick="transferTicket('${esc(t.id)}')" class="tm-action"><span>↗</span><b>Transfer</b></button><button onclick="sellTicket()" class="tm-action"><span>♧</span><b>Sell</b></button><button onclick="shareTicket()" class="tm-action"><span>↗</span><b>Share</b></button><button onclick="downloadPdf('${esc(t.id)}')" class="tm-action"><span>▣</span><b>PDF</b></button></div></div>
      <div class="tm-location"><h3>${esc(e.venue||'Venue')}</h3><p>${esc(loc)}</p><button class="secondary wide" onclick="directions()">Get directions</button></div>
      <div class="tm-social"><small>YOU GOT TICKETS! 🎉</small><h3>Share the moment.</h3><p>Let your friends know you're going.</p><button class="secondary wide" onclick="shareTicket()">Share ticket</button></div>
    </div>
   </section>`;
  window.__ticket=t;refreshQr(t.id);
 }catch(e){$('ticketBox').innerHTML=`<div class="empty">${esc(e.message)}<br><button class="secondary action-btn" onclick="load()">Try again</button></div>`}
}
async function refreshQr(ticketId){
 try{
  const r=await fetch(API+'/tickets/'+encodeURIComponent(ticketId)+'/verify-code',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});
  const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to refresh security code');
  const img=$('qr');if(img){img.classList.remove('qr-refreshing');void img.offsetWidth;img.classList.add('qr-refreshing');img.src=d.qrDataUrl}
  if($('qrStatus'))$('qrStatus').textContent='Refreshes every 15 seconds · valid until '+new Date(d.expiresAt).toLocaleTimeString();
  clearTimeout(window.__qrTimer);window.__qrTimer=setTimeout(()=>refreshQr(ticketId),15000);
 }catch(e){if($('qrStatus'))$('qrStatus').textContent='Security code temporarily unavailable';clearTimeout(window.__qrTimer);window.__qrTimer=setTimeout(()=>refreshQr(ticketId),5000)}
}
function shareTicket(){if(navigator.share)navigator.share({title:window.__ticket?.event?.title||'TicketWAVES ticket',text:'My TicketWAVES ticket',url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href).then(()=>toast('Ticket link copied.'))}
function downloadPdf(x){location.href=API+'/tickets/'+encodeURIComponent(x)+'/pdf'}
function directions(){const e=window.__ticket?.event||{};const q=encodeURIComponent([e.venue,e.city,e.country].filter(Boolean).join(', '));if(q)location.href='https://www.google.com/maps/search/?api=1&query='+q}
function transferTicket(x){localStorage.setItem('ticketwaves_open_transfer',x);location.href='index.html#tickets'}
async function sellTicket(){const t=window.__ticket;if(!t)return;toast('Open Sell from My Tickets to submit your resale request.');location.href='index.html#sell'}
load();
</script></body></html>
