<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152f"><title>Your Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container content-pad"><a class="text-btn" href="index.html#tickets">← My Tickets</a><div id="ticketBox" style="margin-top:14px"><div class="skeleton-card"></div></div></div><script src="config.js"></script><script>
const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',token=localStorage.getItem('ticketwaves_token')||'';const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to load ticket');return d}async function load(){if(!token){location.href='index.html#login';return}try{const t=await api('/tickets/'+encodeURIComponent(id));const e=t.event||{};$('ticketBox').innerHTML=`<article class="ticket-card"><div class="ticket-image">${e.image?`<img src="${esc(e.image)}">`:`<div class="art-word">${esc(e.artist||e.title||'TICKETWAVES')}</div>`}</div><div class="ticket-main"><small class="tiny-label">YOUR TICKET IS READY</small><h2>${esc(e.title)}</h2><div class="ticket-muted">${esc(e.date)} · ${esc(e.time)}</div><p>${esc(e.venue)}${e.city?' · '+esc(e.city):''}</p><div class="ticket-details"><div class="ticket-detail"><small>SECTION</small>${esc(t.section||'General')}</div><div class="ticket-detail"><small>ROW</small>${esc(t.row||'—')}</div><div class="ticket-detail"><small>SEAT</small>${esc(t.seat||'—')}</div><div class="ticket-detail"><small>ORDER CODE</small>${esc(t.ticketCode)}</div></div><div style="background:#fff;border-radius:16px;padding:12px;text-align:center"><img id="qr" alt="Secure ticket QR" style="width:min(250px,70vw);display:block;margin:auto"></div><p class="ticket-muted" style="font-size:12px">For security, this ticket refreshes its verification code automatically.</p><div class="ticket-actions"><button class="secondary" onclick="location.href=API+'/tickets/${esc(t.id)}/pdf'" >PDF</button><button class="secondary" onclick="navigator.share?navigator.share({title:'TicketWAVES ticket',url:location.href}):navigator.clipboard.writeText(location.href)">Share</button><button class="primary" onclick="location.href='index.html#tickets'">Done</button></div></div></article>`;refreshQr(t.id)}catch(e){$('ticketBox').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function refreshQr(ticketId){try{const r=await fetch(API+'/tickets/'+encodeURIComponent(ticketId)+'/verify-code',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();$('qr').src=d.qrDataUrl||'';setTimeout(()=>refreshQr(ticketId),15000)}catch{}}load();
</script></body></html>
