<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d14"><title>Accept Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container narrow content-pad"><div class="auth-card"><div class="auth-logo">🎟️</div><div class="sheet-kicker">TICKET TRANSFER</div><h1 id="title">Your ticket is waiting.</h1><div id="box" class="empty">Loading transfer…</div></div></div><div id="toast" class="toast"></div><script src="config.js"></script><script>
const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',token=localStorage.getItem('ticketwaves_token')||'',t=new URLSearchParams(location.search).get('token'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(m){const x=$('toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2800)}
function busy(btn,on,label){if(!btn)return;if(on){btn.dataset.old=btn.textContent;btn.disabled=true;btn.classList.add('is-loading');btn.innerHTML='<span class="spinner"></span> '+label}else{btn.disabled=false;btn.classList.remove('is-loading');btn.textContent=btn.dataset.old||'Continue'}}
async function get(){const r=await fetch(API+'/transfers/token/'+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw Error(d.message||'Transfer not found');return d}
async function act(path,btn){if(!token){localStorage.setItem('ticketwaves_after_transfer',location.href);location.href='index.html#login';return}busy(btn,true,path.includes('accept')?'Accepting…':'Declining…');try{const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({token:t})});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to complete transfer');toast(path.includes('accept')?'Ticket accepted! 🎉':'Transfer declined.');setTimeout(()=>location.href='index.html#tickets',450)}catch(e){toast(e.message)}finally{busy(btn,false)}}
async function load(){try{if(!t)throw Error('This transfer link is missing its token.');const d=await get();const e=d.ticket?.event||{};const sender=esc(d.fromName||'A TicketWAVES user');const recipient=esc(d.recipientName||d.recipientEmail||'');$('box').className='';$('box').innerHTML=`<div class="transfer-card"><div class="friendly-banner"><div><small>FROM ${sender}</small><h2>${esc(e.title||'Your ticket')}</h2><p>${esc(e.date||'')} · ${esc(e.time||'')}<br>${esc(e.venue||'')}${e.city?' · '+esc(e.city):''}</p></div><div class="ticket-sticker">💌</div></div><div class="transfer-recipient"><span>RECIPIENT</span><b>${recipient}</b><small>${esc(d.recipientEmail||'')}</small></div>${d.status==='pending'?`<div class="transfer-actions"><button id="acceptBtn" class="primary wide action-btn" onclick="act('/transfers/accept-token',this)">Accept ticket</button><button id="declineBtn" class="secondary wide action-btn" onclick="act('/transfers/decline-token',this)">Decline</button></div><p class="ticket-note">For security, acceptance must be completed while signed in with the recipient email above.</p>`:`<div class="verify-good"><b>This transfer is already ${esc(d.status)}.</b><p>You can return to TicketWAVES and view your tickets.</p><button class="primary wide" onclick="location.href='index.html#tickets'">Go to My Tickets</button></div>`}</div>`}catch(e){$('box').className='verify-bad';$('box').innerHTML='<b>'+esc(e.message)+'</b><br><br><button class="secondary" onclick="load()">Try again</button>'}}load();</script></body></html>
