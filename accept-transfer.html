<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>TicketWAVES — Transfer</title><style>body{margin:0;background:#f4f5f7;color:#11182b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(90%,560px);background:#fff;padding:30px;border-radius:24px;text-align:center;box-shadow:0 15px 45px #11182b14}.hero{background:#10152f;color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}button{border:0;border-radius:12px;padding:14px 20px;font-weight:900;background:#1765f5;color:#fff;margin:6px}.secondary{background:#eef3ff;color:#2050c7}</style></head><body><div class="box"><div class="hero"><b>TICKETWAVES</b><h1>You've received a ticket.</h1><p id="from">Loading your secure transfer…</p></div><div id="content">Please wait…</div></div><script src="./config.js"></script><script>const API=((window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api'),t=new URLSearchParams(location.search).get('token');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function run(){const b=document.getElementById('content');if(!t){b.innerHTML='<p>Transfer link is missing.</p>';return}try{const r=await fetch(API+'/transfers/token/'+encodeURIComponent(t),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'Transfer not found');document.getElementById('from').textContent=(d.fromName||'A TicketWAVES user')+' sent this ticket to '+d.recipientEmail;if(d.status!=='pending'){b.innerHTML='<h2>Transfer '+esc(d.status)+'</h2><p>This transfer is no longer pending.</p>';return}const e=d.ticket?.eventId||d.ticket?.event||{};b.innerHTML='<h2>Ticket transfer request</h2><p><b>'+esc(e.title||'Event ticket')+'</b></p><p>'+esc(e.date||'')+(e.time?' · '+esc(e.time):'')+'</p><p>Section '+esc(d.ticket?.section||'-')+' · Row '+esc(d.ticket?.row||'-')+' · Seat '+esc(d.ticket?.seat||'-')+'</p><p>Accept securely in your TicketWAVES account.</p><button onclick="location.href='./index.html?transfer='+encodeURIComponent(t)">'+(d.recipientExists?'Sign in & accept ticket':'Create account & accept ticket')+'</button><button class="secondary" onclick="location.href='./index.html'">Open TicketWAVES</button>'}catch(e){b.innerHTML='<p>'+esc(e.message)+'</p><button class="secondary" onclick="location.reload()">Try again</button>}}run();</script></body></html>
