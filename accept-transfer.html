<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14"><title>Accept Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head>
<body><div class="transfer-page"><div class="container narrow content-pad">
<a class="text-btn" href="index.html#discover">← TicketWAVES</a>
<div class="auth-card transfer-accept-card"><div class="auth-logo">🎟️</div><div class="sheet-kicker">TICKET TRANSFER</div>
<h1 id="title">Your ticket is waiting.</h1><div id="box" class="empty">Loading your transfer…</div></div></div></div>
<div id="toast" class="toast"></div><script src="config.js"></script><script>
const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api';
let token=localStorage.getItem('ticketwaves_token')||'';
const transferToken=new URLSearchParams(location.search).get('token');
const $=x=>document.getElementById(x);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(m){const x=$('toast');x.textContent=m;x.classList.add('show');clearTimeout(window.__toast);setTimeout(()=>x.classList.remove('show'),3000)}
function busy(btn,on,label){if(!btn)return;if(on){btn.dataset.old=btn.textContent;btn.disabled=true;btn.classList.add('is-loading');btn.innerHTML='<span class="spinner"></span> '+esc(label)}else{btn.disabled=false;btn.classList.remove('is-loading');btn.textContent=btn.dataset.old||'Continue'}}
async function getTransfer(){const r=await fetch(API+'/transfers/token/'+encodeURIComponent(transferToken),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'Transfer not found');return d}
function goRegister(d){
  localStorage.setItem('ticketwaves_pending_transfer_token',transferToken);
  localStorage.setItem('ticketwaves_after_transfer','accept-transfer.html?token='+encodeURIComponent(transferToken));
  if(d?.recipientEmail)localStorage.setItem('ticketwaves_transfer_email',d.recipientEmail);
  location.href='index.html#register';
}
function goLogin(){
  localStorage.setItem('ticketwaves_pending_transfer_token',transferToken);
  localStorage.setItem('ticketwaves_after_transfer','accept-transfer.html?token='+encodeURIComponent(transferToken));
  location.href='index.html#login';
}
async function accept(btn){
  if(!token){goRegister(window.transferData);return}
  busy(btn,true,'Accepting ticket…');
  try{
    const r=await fetch(API+'/transfers/accept-token',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({token:transferToken})});
    const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to accept this ticket');
    localStorage.removeItem('ticketwaves_pending_transfer_token');
    localStorage.removeItem('ticketwaves_after_transfer');
    toast('Ticket accepted! 🎉');
    setTimeout(()=>location.href='index.html#tickets',500);
  }catch(e){toast(e.message);busy(btn,false,'Continue')}
}
async function decline(btn){
  if(!token){toast('Sign in or create your account first.');return}
  busy(btn,true,'Declining…');
  try{
    const r=await fetch(API+'/transfers/decline-token',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({token:transferToken})});
    const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to decline transfer');
    toast('Transfer declined.');setTimeout(()=>location.href='index.html#tickets',500);
  }catch(e){toast(e.message);busy(btn,false,'Decline')}
}
async function load(){
  try{
    if(!transferToken)throw Error('This transfer link is missing its secure token.');
    const d=await getTransfer();window.transferData=d;
    const e=d.ticket?.event||{};
    const sender=esc(d.fromName||'A TicketWAVES user');
    const recipient=esc(d.recipientName||d.recipientEmail||'');
    const location=[e.venue,e.city,e.country].filter(Boolean).join(' · ');
    $('box').className='';
    $('box').innerHTML=`<div class="transfer-card">
      <div class="transfer-event-art">${e.image?`<img src="${esc(e.image)}" alt="${esc(e.title||'Event')}">`:''}<div class="transfer-art-overlay"><small>FROM ${sender}</small><b>${esc(e.title||'Your ticket')}</b><span>${esc(e.date||'')} · ${esc(e.time||'')}</span></div></div>
      <div class="transfer-seat"><div><small>SECTION</small><b>${esc(d.ticket?.section||'General')}</b></div><div><small>ROW</small><b>${esc(d.ticket?.row||'—')}</b></div><div><small>SEAT</small><b>${esc(d.ticket?.seat||'—')}</b></div></div>
      <div class="transfer-recipient"><span>RECIPIENT</span><b>${recipient}</b><small>${esc(d.recipientEmail||'')}</small></div>
      ${d.status==='pending'
        ? `<div class="transfer-actions">
             <button id="acceptBtn" class="primary wide action-btn" onclick="accept(this)">Accept ticket</button>
             <button id="declineBtn" class="secondary wide action-btn" onclick="decline(this)">Decline</button>
           </div>
           <p class="ticket-note">${d.recipientExists?'Sign in with the same email address shown above to claim this ticket.':'No TicketWAVES account exists for this email yet. Create your account with this same email, then you will return here and the ticket will be claimed.'}</p>
           ${!token?`<button class="secondary wide action-btn" onclick="goRegister(window.transferData)">Create account & accept</button>`:''}`
        : `<div class="verify-good"><b>Transfer ${esc(d.status)}.</b><p>${d.status==='accepted'?'The ticket has been claimed and a new secure entry code has been issued to the recipient.':'This transfer is no longer active.'}</p><button class="primary wide action-btn" onclick="location.href='index.html#tickets'">View My Tickets</button></div>`}
    </div>`;
  }catch(e){$('box').className='verify-bad';$('box').innerHTML=`<b>${esc(e.message)}</b><br><br><button class="secondary action-btn" onclick="load()">Try again</button>`}
}
load();
</script></body></html>
