<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152f"><title>Accept Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container narrow content-pad"><div class="auth-card"><div class="auth-logo">🎟️</div><small>TICKET TRANSFER</small><h1 id="title">Your ticket is waiting.</h1><div id="box" class="empty">Loading transfer…</div></div></div><script src="config.js"></script><script>const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',token=localStorage.getItem('ticketwaves_token')||'',t=new URLSearchParams(location.search).get('token'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function get(){const r=await fetch(API+'/transfers/token/'+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw Error(d.message||'Transfer not found');return d}async function act(path){if(!token){localStorage.setItem('ticketwaves_after_transfer',location.href);location.href='index.html#login';return}const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({token:t})});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to complete transfer');location.href='index.html#tickets'}async function load(){try{const d=await get();const e=d.ticket?.event||{};$('box').innerHTML=`<div class="friendly-banner"><div><small>FROM ${esc(d.fromName||'A TicketWAVES user')}</small><h2>${esc(e.title||'Your ticket')}</h2><p>${esc(e.date||'')} · ${esc(e.time||'')}<br>${esc(e.venue||'')}</p></div><div class="ticket-sticker">💌</div></div><p style="margin-top:18px">Recipient: <b>${esc(d.recipientEmail)}</b></p>${d.status==='pending'?`<button class="primary wide" onclick="act('/transfers/accept-token')">Accept ticket</button><button class="secondary wide" style="margin-top:8px" onclick="act('/transfers/decline-token')">Decline</button>`:`<div class="verify-good"><b>This transfer is already ${esc(d.status)}.</b></div>`}`}catch(e){$('box').className='verify-bad';$('box').innerHTML='<b>'+esc(e.message)+'</b>'}}load()</script></body></html>
