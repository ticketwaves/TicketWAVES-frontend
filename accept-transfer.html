<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accept Ticket — TicketWAVES</title>
  <meta http-equiv="Cache-Control" content="no-store">
</head>
<body style="margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#10162b">
  <div style="max-width:560px;margin:18vh auto;padding:28px;text-align:center;background:#fff;border:1px solid #e0e3ea;border-radius:24px;box-shadow:0 10px 35px #0001">
    <h1 style="margin:0 0 10px">TicketWAVES</h1>
    <p>Opening your ticket transfer…</p>
  </div>
  <script>
    const token=new URLSearchParams(location.search).get('token');
    if(token){
      location.replace('./index.html?transfer='+encodeURIComponent(token));
    }else{
      location.replace('./index.html');
    }
  </script>
</body>
</html>
