<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Accept Ticket · TicketWAVES</title><style>:root{--blue:#1765f5;--ink:#11182b;--muted:#667085;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{background:#090b10;color:#fff;padding:22px 20px}.brand{font-size:25px;font-weight:950;letter-spacing:-1px}.brand span{color:#4d8dff}.wrap{max-width:620px;margin:0 auto;padding:28px 16px}.card{background:#fff;border:1px solid #e2e6ee;border-radius:24px;box-shadow:0 14px 40px #10182812;overflow:hidden}.hero{background:#10152a;color:#fff;padding:26px}.eyebrow{color:#7da7ff;font-size:12px;font-weight:900;letter-spacing:1.5px}.hero h1{font-size:32px;line-height:1.05;margin:9px 0}.body{padding:26px}.event{background:#f6f8fc;border-radius:17px;padding:18px;margin:18px 0}.event strong{display:block;font-size:20px;margin-bottom:8px}.muted{color:var(--muted);line-height:1.5}button{width:100%;border:0;border-radius:14px;padding:16px 18px;font-weight:900;font-size:16px;margin-top:10px;background:var(--blue);color:#fff}.secondary{background:#eef3ff;color:#2050c7}.error{color:#c93542;font-weight:800}</style></head><body><header class="top"><div class="brand">TICKET<span>WAVES</span></div></header><main class="wrap"><div class="card"><div class="hero"><div class="eyebrow">TICKET TRANSFER</div><h1>You've received a ticket.</h1><div id="from" class="muted" style="color:#d7deee">Loading your secure transfer…</div></div><div class="body" id="box">Please wait…</div></div></main><script src="./config.js"></script><script>const API=((window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api'),token=new URLSearchParams(location.search).get('token');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function goAccept(action){location.href='./index.html?transfer='+encodeURIComponent(token)+(action?'&transferAction='+encodeURIComponent(action):'')}function goHome(){location.href='./index.html'}async function run(){const box=document.getElementById('box');if(!API.startsWith('http')){box.innerHTML='<p class="error">TicketWAVES backend is not configured.</p>';return}if(!token){box.innerHTML='<p class="error">This transfer link is missing its secure token.</p>';return}try{const r=await fetch(API+'/transfers/token/'+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'Transfer not found');document.getElementById('from').textContent=(d.fromName||'A TicketWAVES user')+' sent this ticket to '+d.recipientEmail;if(d.status!=='pending'){box.innerHTML='<h2>Transfer '+esc(d.status)+'</h2><p class="muted">This ticket transfer has already been handled.</p>';return}box.innerHTML='<div class="event"><strong>'+esc(d.ticket?.event?.title||'Event ticket')+'</strong><div class="muted">'+esc(d.ticket?.event?.date||'')+(d.ticket?.event?.time?' · '+esc(d.ticket.event.time):'')+'</div><div class="muted">Section '+esc(d.ticket?.section||'-')+' · Row '+esc(d.ticket?.row||'-')+' · Seat '+esc(d.ticket?.seat||'-')+'</div></div><p class="muted">Accept securely in TicketWAVES. If you already have an account, sign in. If you do not have one, create your account and your ticket will be placed directly in <b>My Tickets</b>.</p>'+(d.recipientExists?'<button onclick="goAccept(\'login\')">Sign in & accept ticket</button>':'<button onclick="goAccept(\'register\')">Create account & accept ticket</button>')+'<button class="secondary" onclick="goHome()">Open TicketWAVES</button>'}catch(e){box.innerHTML='<p class="error">'+esc(e.message)+'</p><button class="secondary" onclick="location.reload()">Try again</button>'}}run();</script></body></html>
