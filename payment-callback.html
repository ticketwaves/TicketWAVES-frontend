<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152f"><title>Payment · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container narrow content-pad"><div class="auth-card"><div class="auth-logo">✓</div><small>PAYMENT CHECK</small><h1 id="heading">Checking your payment…</h1><div id="box" class="empty">Please keep this page open for a moment.</div></div></div><script src="config.js"></script><script>const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',q=new URLSearchParams(location.search),ref=q.get('reference'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function check(){try{const r=await fetch(API+'/payment/verify/'+encodeURIComponent(ref));const d=await r.json();if(r.status===202){$('box').innerHTML='<p>Payment is still being confirmed. We will check again shortly.</p>';setTimeout(check,4000);return}if(!r.ok||!d.status)throw Error(d.message||'Payment could not be confirmed');$('heading').textContent='You’re all set! 🎉';$('box').className='verify-good';$('box').innerHTML='<h2>Your ticket is ready.</h2><p>Payment was confirmed and your ticket has been added to My Tickets.</p><button class="primary wide" onclick="location.href=\'index.html#tickets\'">Open My Tickets</button>'}catch(e){$('heading').textContent='We need one more check';$('box').className='verify-bad';$('box').innerHTML='<p>'+esc(e.message)+'</p><button class="primary" onclick="check()">Try again</button>'}}if(ref)check();else{$('box').className='verify-bad';$('box').textContent='Payment reference is missing.'}</script></body></html>
