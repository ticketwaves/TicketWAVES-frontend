<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>TicketWAVES — Payment</title><style>body{margin:0;background:#f4f5f7;color:#11182b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(90%,520px);background:#fff;border-radius:24px;padding:35px;text-align:center;box-shadow:0 15px 45px #11182b14}.spinner{width:42px;height:42px;border:5px solid #1765f5;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;background:#1765f5;color:#fff;padding:14px 20px;font-weight:900}</style></head><body><div class="box"><div id="spin" class="spinner"></div><h1 id="title">Confirming payment…</h1><p id="m">Please wait while TicketWAVES confirms your payment and issues your ticket.</p></div><script src="./config.js"></script><script>const API=((window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api'),ref=new URLSearchParams(location.search).get('reference')||new URLSearchParams(location.search).get('trxref'),tk=localStorage.getItem('ticketwaves_token')||localStorage.getItem('token');async function run(){if(!ref||!tk)throw Error('Your payment reference or sign-in session is missing. Please sign in and check My Tickets.');const r=await fetch(API+'/payment/verify/'+encodeURIComponent(ref),{headers:{Authorization:'Bearer '+tk},cache:'no-store'});const d=await r.json();if(!r.ok||!d.status)throw Error(d.message||'Payment could not be confirmed yet.');document.getElementById('spin').style.display='none';document.getElementById('title').textContent='Payment confirmed ✓';document.getElementById('m').textContent='Your ticket is now in My Tickets.';setTimeout(()=>location.replace('./index.html'),900)}run().catch(e=>{document.getElementById('spin').style.display='none';document.getElementById('title').textContent='Payment verification';document.getElementById('m').innerHTML=(e.message||'Payment verification failed.')+'<br><br><button onclick="location.replace('./index.html')">Return to TicketWAVES</button>'});</script></body></html>
