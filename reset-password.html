<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152f"><title>Reset Password · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container narrow content-pad"><div class="auth-card"><div class="auth-logo">🔐</div><small>SECURITY</small><h1>Choose a new password.</h1><form id="f"><label>New password<input id="p" type="password" minlength="6" required></label><label>Confirm password<input id="p2" type="password" minlength="6" required></label><button class="primary wide">Update password</button></form><div id="m" class="muted" style="margin-top:14px"></div></div></div><script src="config.js"></script><script>const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',t=new URLSearchParams(location.search).get('token');document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m');if(p.value!==p2.value){m.textContent='Passwords do not match.';return}try{const r=await fetch(API+'/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t,password:p.value})});const d=await r.json();if(!r.ok)throw Error(d.message);m.textContent=d.message+' You can now sign in.';setTimeout(()=>location.href='index.html#login',1200)}catch(e){m.textContent=e.message}}</script></body></html>
