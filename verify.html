<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152f"><title>Verify Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container narrow content-pad"><div class="auth-card"><div class="auth-logo">✓</div><small>TICKETWAVES CHECK</small><h1>Ticket verification</h1><div id="result" class="empty">Checking this ticket…</div></div></div><script src="config.js"></script><script>const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',q=new URLSearchParams(location.search),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function run(){try{const r=await fetch(API+'/tickets/verify?ticket='+encodeURIComponent(q.get('ticket')||'')+'&code='+encodeURIComponent(q.get('code')||''));const d=await r.json();if(!r.ok||!d.valid)throw Error(d.message||'Ticket is not valid');const t=d.ticket,e=t.event||{};$('result').className='verify-good';$('result').innerHTML='<h2>✓ Valid ticket</h2><p><b>'+esc(e.title)+'</b></p><p>'+esc(e.date||'')+' · '+esc(e.time||'')+'<br>'+esc(e.venue||'')+'</p><p>Section '+esc(t.section||'General')+' · Row '+esc(t.row||'—')+' · Seat '+esc(t.seat||'—')+'</p><small>Verification code expires '+new Date(d.expiresAt).toLocaleTimeString()+'</small>'}catch(e){$('result').className='verify-bad';$('result').innerHTML='<h2>✕ Not valid</h2><p>'+esc(e.message)+'</p><p>This code may have expired. Ask the ticket holder to open the ticket again.</p>'}}run()</script></body></html>
