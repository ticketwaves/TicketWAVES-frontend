<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d14"><title>Verify Ticket · TicketWAVES</title><link rel="stylesheet" href="style.css"></head><body><div class="container narrow content-pad"><div class="auth-card"><div class="verify-logo">✓</div><div class="sheet-kicker">TICKETWAVES CHECK</div><h1>Ticket verification</h1><div id="result" class="empty">Checking this ticket…</div></div></div><script src="config.js"></script><script>
const API=(window.TICKETWAVES_API_URL||'').replace(/\/$/,'')+'/api',q=new URLSearchParams(location.search),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function run(){try{const r=await fetch(API+'/tickets/verify?ticket='+encodeURIComponent(q.get('ticket')||'')+'&code='+encodeURIComponent(q.get('code')||''));const d=await r.json();if(!r.ok||!d.valid)throw Error(d.message||'Ticket is not valid');const t=d.ticket,e=t.event||{},o=d.owner||{};const verifiedAt=d.verifiedAt?new Date(d.verifiedAt).toLocaleString():new Date().toLocaleString();$('result').className='verify-good';$('result').innerHTML=`<span class="verify-stamp">✓ VERIFIED TICKET</span><h2>Legitimate TicketWAVES ticket</h2><p>This code was verified by the TicketWAVES server and is valid for the event shown below.</p><div class="verify-proof"><div><small>EVENT</small><b>${esc(e.title||'Event')}</b></div><div><small>DATE & TIME</small><b>${esc(e.date||'')} · ${esc(e.time||'')}</b></div><div><small>VENUE</small><b>${esc(e.venue||'')}${e.city?' · '+esc(e.city):''}${e.country?' · '+esc(e.country):''}</b></div><div><small>TICKET HOLDER</small><b>${esc(o.name||'Ticket holder')}</b></div><div><small>SEAT</small><b>Section ${esc(t.section||'General')} · Row ${esc(t.row||'—')} · Seat ${esc(t.seat||'—')}</b></div><div><small>TICKET CODE</small><b>${esc(t.ticketCode||'—')}</b></div><div><small>VERIFIED AT</small><b>${esc(verifiedAt)}</b></div><div><small>CODE STATUS</small><b>Valid until ${esc(new Date(d.expiresAt).toLocaleTimeString())}</b></div></div><p style="margin-top:14px;font-size:12px">The verification code is short-lived and changes when the ticket holder refreshes their mobile ticket.</p>`}catch(e){$('result').className='verify-bad';$('result').innerHTML='<h2>✕ Not valid</h2><p>'+esc(e.message)+'</p><p>This code may have expired. Ask the ticket holder to open their TicketWAVES ticket and show the current code.</p>'}}run();</script></body></html>
